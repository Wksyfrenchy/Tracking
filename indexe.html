<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#fdf6ee">
<title>Mon compteur</title>
<style>
:root{--bg:#fdf6ee;--card:#fff;--text:#2d3436;--muted:#8e8a85;--green:#2bb39b;--green-l:#d9f4ee;--sun:#ffb938;--sun-l:#fff1d6;--red:#ff6b6b;--red-l:#ffe1e1;--line:#efe6da;--shadow:0 6px 18px rgba(80,60,30,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:460px;min-height:100%;padding:16px 16px 96px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.label{width:100%;border:none;background:transparent;font:inherit;font-size:1.35rem;font-weight:800;color:var(--text);outline:none;border-bottom:2px dashed transparent}
.label:focus{border-bottom-color:var(--line)}
.date{color:var(--muted);font-size:.85rem;text-transform:capitalize;margin-top:2px}
.gaugewrap{display:flex;gap:18px;align-items:center;margin:16px 0 14px}
.tank{width:84px;height:210px;border-radius:42px;background:#f4ede3;position:relative;overflow:hidden;flex:none;border:3px solid #f0e6d8}
.fill{position:absolute;left:0;right:0;bottom:0;transition:height .5s ease,background .4s;border-radius:0 0 40px 40px}
.fill::after{content:"";position:absolute;left:0;right:0;top:-6px;height:12px;background:inherit;border-radius:50%;opacity:.9}
.side{flex:1;min-width:0}
.mood{font-size:2.6rem;line-height:1}
.big{font-size:2.8rem;font-weight:900;line-height:1.1;margin-top:6px}
.big small{font-size:1.2rem;color:var(--muted);font-weight:700}
.msg{margin-top:8px;font-size:.95rem;line-height:1.35;color:#5a5650}
.btns{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.btn{border:none;border-radius:18px;padding:14px;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer;background:var(--text);color:#fff;transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn.minus{background:#f0e9df;color:var(--text)}
.btn.plus{background:var(--green);color:#fff;font-size:1.3rem}
.btn.ghost{background:var(--green-l);color:#1d8a76;margin-top:10px;width:100%}
.btn.play{background:var(--sun);color:#4a3200;width:100%;padding:16px;font-size:1.1rem}
.obj{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px;color:var(--muted);font-size:.9rem}
.obj b{color:var(--text);font-size:1.1rem;min-width:22px;text-align:center}
.obj button{width:32px;height:32px;border-radius:50%;border:none;background:#f0e9df;font:inherit;font-weight:800;font-size:1.1rem;cursor:pointer}
h2{font-size:1.05rem;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline}
h2 span{font-size:.8rem;color:var(--muted);font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dcol{display:flex;flex-direction:column;align-items:center;gap:4px}
.bar-area{position:relative;width:100%;height:110px;background:#faf5ec;border-radius:12px;overflow:hidden}
.goal{position:absolute;left:0;right:0;border-top:2px dashed #d7c9b4;z-index:2}
.bar{position:absolute;left:18%;right:18%;bottom:0;border-radius:8px 8px 0 0;min-height:5px;transition:height .4s}
.bar.ok{background:var(--green)}.bar.warn{background:var(--sun)}.bar.over{background:var(--red)}.bar.na{background:transparent}
.dv{font-weight:800;font-size:.9rem}
.dn{font-size:.78rem;color:var(--muted);width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.dn.today{background:var(--text);color:#fff;font-weight:800}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.stat{background:#faf5ec;border-radius:16px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:1.25rem}
.stat span{font-size:.72rem;color:var(--muted)}
.trend{margin-top:12px;font-size:.9rem;text-align:center;padding:10px;border-radius:14px}
.trend.good{background:var(--green-l);color:#1d6e5f}.trend.flat{background:var(--sun-l);color:#7a5200}.trend.bad{background:#f4efe8;color:#5a5650}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(253,246,238,.94);backdrop-filter:blur(8px)}
nav button{border:none;border-radius:18px;padding:12px;font:inherit;font-weight:800;font-size:.95rem;background:#f0e9df;color:var(--muted);cursor:pointer}
nav button.on{background:var(--text);color:#fff}
/* jeux */
.gmenu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gcard{border:none;background:var(--card);border-radius:22px;padding:18px 10px;box-shadow:var(--shadow);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.gcard .e{font-size:2.4rem}.gcard b{font-size:1rem}.gcard span{font-size:.78rem;color:var(--muted)}
.gcard:active{transform:scale(.97)}
.back{border:none;background:#f0e9df;border-radius:14px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;margin-bottom:10px}
.gstatus{text-align:center;font-weight:800;font-size:1.05rem;margin-bottom:12px;min-height:26px}
.gscore{text-align:center;color:var(--muted);font-size:.85rem;margin:12px 0}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:0 auto}
.ttt button,.mem button,.mole button{aspect-ratio:1;border:none;border-radius:18px;background:#f4ede3;font:inherit;font-size:2.2rem;font-weight:900;cursor:pointer}
.ttt .x{color:var(--green)}.ttt .o{color:var(--red)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px;margin:0 auto}
.mem button.up{background:var(--sun-l)}.mem button.done{background:var(--green-l)}
.mole{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto 12px}
.mole button{background:#e9dcc7;font-size:2.4rem}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:280px;margin:0 auto 12px}
.simon button{aspect-ratio:1;border:none;border-radius:26px;opacity:.45;cursor:pointer;transition:opacity .1s,transform .1s}
.simon button.lit{opacity:1;transform:scale(1.04)}
.cv{display:block;margin:0 auto;border-radius:16px;background:#faf5ec;touch-action:none;max-width:100%}
.dpad{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center;margin:12px 0}
.dpad button{height:54px;border:none;border-radius:16px;background:#f0e9df;font-size:1.4rem;cursor:pointer}
.row{display:flex;justify-content:center;margin-top:6px}
.row .btn{padding:12px 28px}
</style>
</head>
<body>
<div class="app"><div id="view"></div></div>
<nav>
  <button id="t-home" class="on" data-tab="home">📊 Mon suivi</button>
  <button id="t-games" data-tab="games">🎮 Jeux</button>
</nav>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var pad=function(n){return String(n).padStart(2,'0')};
var keyOf=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var todayKey=function(){return keyOf(new Date())};
var rnd=function(n){return Math.floor(Math.random()*n)};
var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};

/* ---------- Données ---------- */
var KEY='compteur_v2';
function norm(o){
  var h=o.history||{};
  var ks=Object.keys(h).sort();
  return {label:o.label||'Mon objectif',objectif:Math.max(1,parseInt(o.objectif,10)||5),history:h,resist:o.resist||{},start:o.start||ks[0]||todayKey()};
}
function load(){
  try{
    var s=localStorage.getItem(KEY);
    if(s)return norm(JSON.parse(s));
    // reprise de l'ancienne version si elle existe
    for(var i=0;i<localStorage.length;i++){
      try{var o=JSON.parse(localStorage.getItem(localStorage.key(i)));
        if(o&&typeof o==='object'&&o.history&&o.objectif)return norm(o);}catch(e){}
    }
  }catch(e){}
  return norm({});
}
var state=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function best(name){try{return parseInt(localStorage.getItem('best_'+name),10)||0}catch(e){return 0}}
function setBest(name,v){try{localStorage.setItem('best_'+name,String(v))}catch(e){}}

/* ---------- Suivi ---------- */
var tab='home';
function msgFor(c,o){
  if(c===0)return 'Zéro pour l\'instant, bravo ! 🌟';
  if(c>o)return 'Pas grave. Demain est un nouveau départ, chaque jour compte 🌱';
  if(c===o)return 'Limite atteinte : stop pour aujourd\'hui, tu en es capable 💪';
  if(c/o>=.7)return 'Tu approches de ta limite. Respire, tu peux y arriver 🌬️';
  return 'Tu gères, continue comme ça 💚';
}
function moodFor(c,o){
  if(c===0)return '😄';if(c>o)return '🤗';if(c===o)return '✋';if(c/o>=.7)return '😬';return '🙂';
}
function daysBack(n){var d=new Date();d.setDate(d.getDate()-n);return d}
function renderHome(){
  var k=todayKey(),c=state.history[k]||0,o=state.objectif,res=state.resist[k]||0;
  var pct=Math.min(c/o,1)*100;
  var col=c>o?'var(--red)':(c/o>=.7?'var(--sun)':'var(--green)');
  var date=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});

  // 7 jours
  var vals=[],cols='',i,d,kk,v,valid,cls,L=['D','L','M','M','J','V','S'];
  for(i=6;i>=0;i--){d=daysBack(i);kk=keyOf(d);valid=kk>=state.start;v=state.history[kk]||0;vals.push(valid?v:0)}
  var max=Math.max.apply(null,vals.concat([o,1]));
  var okDays=0,total=0,validDays=0;
  for(i=6;i>=0;i--){
    d=daysBack(i);kk=keyOf(d);valid=kk>=state.start;v=state.history[kk]||0;
    cls=!valid?'na':(v>o?'over':(v===o?'warn':'ok'));
    if(valid){validDays++;total+=v;if(v<=o)okDays++}
    cols+='<div class="dcol"><div class="bar-area"><div class="goal" style="bottom:'+(o/max*100)+'%"></div>'+
      (valid?'<div class="bar '+cls+'" style="height:'+(v/max*100)+'%"></div>':'')+'</div>'+
      '<div class="dv">'+(valid?v:'–')+'</div><div class="dn'+(i===0?' today':'')+'">'+L[d.getDay()]+'</div></div>';
  }
  var prev=0,pv=0;
  for(i=13;i>=7;i--){kk=keyOf(daysBack(i));if(kk>=state.start){prev+=state.history[kk]||0;pv++}}
  // série
  var streak=0;
  for(i=0;i<400;i++){kk=keyOf(daysBack(i));if(kk<state.start)break;if((state.history[kk]||0)<=o)streak++;else break}
  var trend='';
  if(pv>0){
    var diff=total-prev;
    if(diff<0)trend='<div class="trend good">📉 '+Math.abs(diff)+' de moins que la semaine dernière. Bravo, ça paie !</div>';
    else if(diff===0)trend='<div class="trend flat">⚖️ Pareil que la semaine dernière. Tu tiens bon, vise un peu moins demain.</div>';
    else trend='<div class="trend bad">🌱 '+diff+' de plus que la semaine dernière. Ce n\'est pas grave, on repart.</div>';
  }else{
    trend='<div class="trend flat">✨ Ton suivi commence. Chaque jour compte, la comparaison arrivera la semaine prochaine.</div>';
  }

  $('#view').innerHTML=
  '<section class="card">'+
    '<input class="label" id="label" value="'+esc(state.label)+'" maxlength="40" aria-label="Nom de l\'habitude">'+
    '<div class="date">'+date+'</div>'+
    '<div class="gaugewrap">'+
      '<div class="tank"><div class="fill" style="height:'+pct+'%;background:'+col+'"></div></div>'+
      '<div class="side"><div class="mood">'+moodFor(c,o)+'</div>'+
      '<div class="big">'+c+' <small>/ '+o+'</small></div>'+
      '<div class="msg">'+msgFor(c,o)+'</div></div>'+
    '</div>'+
    '<div class="btns"><button class="btn minus" data-act="minus">−1</button><button class="btn plus" data-act="plus">+1</button></div>'+
    '<button class="btn ghost" data-act="resist">J\'ai résisté 💪 ('+res+')</button>'+
    '<div class="obj">Maximum du jour <button data-act="om">−</button><b>'+o+'</b><button data-act="op">+</button></div>'+
  '</section>'+
  '<section class="card" style="margin-top:14px"><h2>Mes 7 derniers jours <span>- - - = mon objectif</span></h2>'+
    '<div class="week">'+cols+'</div>'+
    '<div class="stats"><div class="stat"><b>'+streak+' 🔥</b><span>jours de suite dans l\'objectif</span></div>'+
    '<div class="stat"><b>'+okDays+'/'+validDays+'</b><span>jours réussis</span></div>'+
    '<div class="stat"><b>'+total+'</b><span>total sur 7 jours</span></div></div>'+trend+
  '</section>'+
  '<button class="btn play" style="margin-top:14px" data-act="craving">Une envie là, maintenant ? Viens jouer 🎮</button>';
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act'),k=todayKey();
  if(a==='plus'){state.history[k]=(state.history[k]||0)+1}
  else if(a==='minus'){state.history[k]=Math.max(0,(state.history[k]||0)-1)}
  else if(a==='resist'){state.resist[k]=(state.resist[k]||0)+1}
  else if(a==='om'){state.objectif=Math.max(1,state.objectif-1)}
  else if(a==='op'){state.objectif=state.objectif+1}
  else if(a==='craving'){setTab('games');return}
  else return;
  save();renderHome();
});
document.addEventListener('change',function(e){
  if(e.target.id==='label'){state.label=e.target.value.trim()||'Mon objectif';save()}
});

/* ---------- Jeux : outils ---------- */
var G={t:[],i:[],h:[]};
function setT(f,ms){var id=setTimeout(f,ms);G.t.push(id);return id}
function setI(f,ms){var id=setInterval(f,ms);G.i.push(id);return id}
function stopGame(){G.t.forEach(clearTimeout);G.i.forEach(clearInterval);G.h.forEach(function(h){document.removeEventListener('keydown',h)});G={t:[],i:[],h:[]}}

var GAMES=[
  {id:'morpion',e:'⭕',n:'Morpion',d:'Contre l\'ordi',f:morpion},
  {id:'memory',e:'🃏',n:'Memory',d:'Trouve les paires',f:memory},
  {id:'taupe',e:'🐹',n:'Tape-taupe',d:'20 secondes chrono',f:taupe},
  {id:'simon',e:'🎵',n:'Simon',d:'Répète la séquence',f:simon},
  {id:'snake',e:'🐍',n:'Snake',d:'Mange et grandis',f:snake}
];
function renderGames(){
  stopGame();
  $('#view').innerHTML='<section class="card" style="margin-bottom:14px"><h2>Occupe tes mains, l\'envie va passer 🌊</h2>'+
    '<div style="color:var(--muted);font-size:.9rem">Une envie dure en général quelques minutes. Joue un peu, puis reviens.</div></section>'+
    '<div class="gmenu">'+GAMES.map(function(g){return '<button class="gcard" data-game="'+g.id+'"><div class="e">'+g.e+'</div><b>'+g.n+'</b><span>'+g.d+'</span></button>'}).join('')+'</div>';
}
function openGame(id){
  stopGame();
  var g=GAMES.filter(function(x){return x.id===id})[0];
  $('#view').innerHTML='<button class="back" id="back">← Les jeux</button><section class="card"><h2>'+g.e+' '+g.n+'</h2><div id="game"></div></section>';
  g.f($('#game'));
}
document.addEventListener('click',function(e){
  var g=e.target.closest('[data-game]');if(g){openGame(g.getAttribute('data-game'));return}
  if(e.target.id==='back')renderGames();
});

/* ---------- Jeu 1 : Morpion ---------- */
function morpion(el){
  var b=Array(9).fill(''),over=false,sc={x:0,o:0,n:0};
  var L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  el.innerHTML='<div class="gstatus" id="ms">À toi (❌)</div><div class="ttt" id="mb"></div><div class="gscore" id="msc"></div><div class="row"><button class="btn" id="mr">Rejouer</button></div>';
  var win=function(p){return L.some(function(l){return l.every(function(i){return b[i]===p})})};
  function draw(){
    $('#mb').innerHTML=b.map(function(v,i){return '<button data-i="'+i+'" class="'+(v==='X'?'x':'o')+'">'+(v==='X'?'✕':v==='O'?'◯':'')+'</button>'}).join('');
    $('#msc').textContent='Toi '+sc.x+' · Ordi '+sc.o+' · Nul '+sc.n;
  }
  function end(){
    if(win('X')){sc.x++;$('#ms').textContent='Bravo, tu as gagné ! 🎉';over=true}
    else if(win('O')){sc.o++;$('#ms').textContent='L\'ordi gagne cette fois 😅';over=true}
    else if(b.every(Boolean)){sc.n++;$('#ms').textContent='Match nul 🤝';over=true}
    draw();return over;
  }
  function ai(){
    var free=[];b.forEach(function(v,i){if(!v)free.push(i)});
    function tryp(p){for(var j=0;j<free.length;j++){var i=free[j];b[i]=p;var w=win(p);b[i]='';if(w)return i}return null}
    var m=null;
    if(Math.random()<.8){m=tryp('O');if(m===null)m=tryp('X');if(m===null&&!b[4])m=4}
    if(m===null)m=free[rnd(free.length)];
    b[m]='O';
  }
  $('#mb').addEventListener('click',function(e){
    var t=e.target.closest('button');if(!t||over)return;
    var i=+t.getAttribute('data-i');if(b[i])return;
    b[i]='X';if(end())return;
    $('#ms').textContent='L\'ordi réfléchit…';
    setT(function(){ai();if(!end())$('#ms').textContent='À toi (❌)'},350);
  });
  $('#mr').onclick=function(){b=Array(9).fill('');over=false;$('#ms').textContent='À toi (❌)';draw()};
  draw();
}

/* ---------- Jeu 2 : Memory ---------- */
function memory(el){
  var em=['🐶','🌸','🍓','🚀','🎈','🐢','🌈','🍀'],cards,open,lock,moves,found;
  el.innerHTML='<div class="gstatus" id="gs"></div><div class="mem" id="gb"></div><div class="row" style="margin-top:14px"><button class="btn" id="gr">Nouvelle partie</button></div>';
  function status(){$('#gs').textContent=found===8?'Bravo ! Fini en '+moves+' coups 🎉':'Coups : '+moves+' · Paires : '+found+'/8'}
  function draw(){
    $('#gb').innerHTML=cards.map(function(c,i){
      var st=c.done?'done':(c.up?'up':'');
      return '<button data-i="'+i+'" class="'+st+'">'+((c.up||c.done)?c.v:'❔')+'</button>'}).join('');
  }
  cards=[];
  $('#gb').addEventListener('click',function(e){
    var t=e.target.closest('button');if(!t||lock)return;
    var i=+t.getAttribute('data-i'),c=cards[i];if(c.up||c.done)return;
    c.up=true;open.push(i);draw();
    if(open.length===2){
      moves++;var a=cards[open[0]],b=cards[open[1]];
      if(a.v===b.v){a.done=b.done=true;a.up=b.up=false;found++;open=[];setT(draw,50);status()}
      else{lock=true;setT(function(){a.up=b.up=false;open=[];lock=false;draw()},750);status()}
    }
  });
  function init(){cards=shuffle(em.concat(em)).map(function(v){return {v:v}});open=[];lock=false;moves=0;found=0;draw();status()}
  $('#gr').onclick=init;init();
}

/* ---------- Jeu 3 : Tape-taupe ---------- */
function taupe(el){
  var score=0,time=20,cur=-1,run=false;
  el.innerHTML='<div class="gstatus" id="ts">Prêt ? Tape un maximum de taupes !</div><div class="mole" id="tb"></div><div class="gscore" id="tbest"></div><div class="row"><button class="btn" id="tgo">Jouer</button></div>';
  function draw(){$('#tb').innerHTML=Array.apply(null,Array(9)).map(function(_,i){return '<button data-i="'+i+'">'+(i===cur?'🐹':'')+'</button>'}).join('');$('#tbest').textContent='Record : '+best('taupe')}
  function status(){$('#ts').textContent=run?'⏱ '+time+' s · Score : '+score:'Terminé ! Score : '+score}
  function stop(){
    run=false;cur=-1;G.i.forEach(clearInterval);G.i=[];
    if(score>best('taupe')){setBest('taupe',score)}
    draw();status();
  }
  $('#tb').addEventListener('click',function(e){
    var t=e.target.closest('button');if(!t||!run)return;
    if(+t.getAttribute('data-i')===cur){score++;cur=-1;draw();status()}
  });
  $('#tgo').onclick=function(){
    G.i.forEach(clearInterval);G.i=[];
    score=0;time=20;run=true;cur=-1;status();draw();
    setI(function(){time--;if(time<=0){stop();return}status()},1000);
    setI(function(){var n;do{n=rnd(9)}while(n===cur);cur=n;draw()},750);
  };
  draw();
}

/* ---------- Jeu 4 : Simon ---------- */
function simon(el){
  var C=['#ff6b6b','#ffb938','#2bb39b','#6c8cff'],seq=[],idx=0,busy=true;
  el.innerHTML='<div class="gstatus" id="ss">Appuie sur Jouer</div><div class="simon" id="sb">'+C.map(function(c,i){return '<button data-i="'+i+'" style="background:'+c+'"></button>'}).join('')+'</div><div class="gscore" id="sbest"></div><div class="row"><button class="btn" id="sgo">Jouer</button></div>';
  var pads=el.querySelectorAll('.simon button');
  function show(){$('#sbest').textContent='Record : '+best('simon')}
  function flash(i,ms){pads[i].classList.add('lit');setT(function(){pads[i].classList.remove('lit')},ms||350)}
  function play(){
    busy=true;$('#ss').textContent='Regarde bien…';var i=0;
    (function step(){
      if(i>=seq.length){busy=false;idx=0;$('#ss').textContent='À toi ! ('+seq.length+')';return}
      flash(seq[i],350);i++;setT(step,600);
    })();
  }
  function next(){seq.push(rnd(4));setT(play,500)}
  $('#sb').addEventListener('click',function(e){
    var t=e.target.closest('button');if(!t||busy)return;
    var i=+t.getAttribute('data-i');flash(i,200);
    if(i!==seq[idx]){
      busy=true;var s=seq.length-1;
      if(s>best('simon'))setBest('simon',s);
      $('#ss').textContent='Raté ! Score : '+s+' 😅';show();return;
    }
    idx++;
    if(idx===seq.length){busy=true;$('#ss').textContent='Bien joué ! 👏';next()}
  });
  $('#sgo').onclick=function(){stopGame();seq=[];busy=true;next()};
  show();
}

/* ---------- Jeu 5 : Snake ---------- */
function snake(el){
  var N=16,S=18,sn,dir,nd,food,score,alive=false;
  el.innerHTML='<div class="gstatus" id="ns">Glisse ou utilise les flèches</div><canvas class="cv" id="cv" width="'+N*S+'" height="'+N*S+'"></canvas>'+
    '<div class="dpad"><span></span><button data-d="u">▲</button><span></span><button data-d="l">◀</button><button data-d="d">▼</button><button data-d="r">▶</button></div>'+
    '<div class="gscore" id="nbest"></div><div class="row"><button class="btn" id="ngo">Jouer</button></div>';
  var cv=$('#cv'),cx=cv.getContext('2d');
  function put(){do{food={x:rnd(N),y:rnd(N)}}while(sn.some(function(p){return p.x===food.x&&p.y===food.y}))}
  function draw(){
    cx.fillStyle='#faf5ec';cx.fillRect(0,0,N*S,N*S);
    if(food){cx.font=(S-2)+'px serif';cx.textBaseline='top';cx.fillText('🍎',food.x*S,food.y*S+1)}
    if(sn)sn.forEach(function(p,i){cx.fillStyle=i===0?'#1d8a76':'#2bb39b';cx.beginPath();cx.roundRect?cx.roundRect(p.x*S+1,p.y*S+1,S-2,S-2,5):cx.rect(p.x*S+1,p.y*S+1,S-2,S-2);cx.fill()});
    $('#nbest').textContent='Score : '+(score||0)+' · Record : '+best('snake');
  }
  function turn(x,y){if(!dir||(x===-dir.x&&y===-dir.y))return;nd={x:x,y:y}}
  function tick(){
    dir=nd;
    var h={x:(sn[0].x+dir.x+N)%N,y:(sn[0].y+dir.y+N)%N};
    if(sn.some(function(p){return p.x===h.x&&p.y===h.y})){
      alive=false;G.i.forEach(clearInterval);G.i=[];
      if(score>best('snake'))setBest('snake',score);
      $('#ns').textContent='Perdu ! Score : '+score+' 😅';draw();return;
    }
    sn.unshift(h);
    if(h.x===food.x&&h.y===food.y){score++;put()}else sn.pop();
    draw();
  }
  function start(){
    G.i.forEach(clearInterval);G.i=[];
    sn=[{x:8,y:8},{x:7,y:8},{x:6,y:8}];dir={x:1,y:0};nd=dir;score=0;alive=true;put();
    $('#ns').textContent='C\'est parti !';draw();setI(tick,150);
  }
  el.querySelector('.dpad').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    var d=b.getAttribute('data-d');
    if(d==='u')turn(0,-1);else if(d==='d')turn(0,1);else if(d==='l')turn(-1,0);else turn(1,0);
  });
  var sx,sy;
  cv.addEventListener('touchstart',function(e){var t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});
  cv.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});
  cv.addEventListener('touchend',function(e){
    var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.max(Math.abs(dx),Math.abs(dy))<16)return;
    if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0);else turn(0,dy>0?1:-1);
  });
  var kh=function(e){var m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m){e.preventDefault();turn(m[0],m[1])}};
  document.addEventListener('keydown',kh);G.h.push(kh);
  $('#ngo').onclick=start;
  draw();
}

/* ---------- Navigation ---------- */
function setTab(t){
  tab=t;
  $('#t-home').classList.toggle('on',t==='home');
  $('#t-games').classList.toggle('on',t==='games');
  stopGame();
  if(t==='home')renderHome();else renderGames();
  window.scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(function(b){b.addEventListener('click',function(){setTab(b.getAttribute('data-tab'))})});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&tab==='home')renderHome()});
renderHome();
})();
</script>
